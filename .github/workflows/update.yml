name: Atualizar canais
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-canais
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar catálogo
        run: node scripts/build.mjs
      - name: Salvar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A public data
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza canais"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi
      - name: Testar links (remove os que cortam em ~30s)
        run: node scripts/check.mjs
      - name: Gerar catálogo filtrado
        run: node scripts/build.mjs
      - name: Salvar de novo
        run: |
          git add -A public data
          if ! git diff --cached --quiet; then
            git commit -m "Remove links que cortam"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi
          
